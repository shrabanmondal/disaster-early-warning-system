<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Early Warning App</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <!-- Leaflet CSS for Map rendering -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        #map {
            height: 200px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-left: 6px solid #888;
        }
        .card.low { border-left-color: #f1c40f; }
        .card.med { border-left-color: #e67e22; }
        .card.high { border-left-color: #e74c3c; }
        .mag {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .location {
            font-size: 0.9rem;
            margin: 4px 0;
        }
        .time {
            font-size: 0.8rem;
            color: #aaa;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button.notify-btn {
            background: #28a745;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2 style="margin:0;">🚨 Early Warning App</h2>
            <p style="font-size: 0.8rem; color: #4cd137; margin-top: 4px;">● Live Telemetry Connected</p>
        </div>
        
        <div id="map"></div>
        <button class="notify-btn" onclick="enableNotifications()">🔔 Enable Emergency Popups</button>
        <button onclick="fetchAlerts()">🔄 Refresh Live Telemetry</button>
        <div id="alerts-list">Loading alerts...</div>
    </div>

    <!-- Leaflet JS for Map rendering -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([20, 0], 1);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let markers = [];
        let notifiedEvents = new Set();
        const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        function playAlertSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {
                console.log("Audio play blocked by browser policy.");
            }
        }

        function enableNotifications() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("Notifications enabled! You will be alerted when strong earthquakes occur.");
                        playAlertSound();
                    }
                });
            } else {
                alert("This browser does not support desktop notifications.");
            }
        }

        function formatToNativeTime(utcTimestamp) {
            return new Date(utcTimestamp).toLocaleString(undefined, {
                timeZone: userTimeZone,
                year: 'numeric',
                month: 'numeric',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZoneName: 'short'
            });
        }

        async function fetchAlerts() {
            const container = document.getElementById('alerts-list');
            try {
                // Configured with your local IP address for cross-device access
                const response = await fetch('http://192.168.42.54:8000/live-usgs?min_magnitude=2.0');
                const data = await response.json();
                
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                if (!data.events || data.events.length === 0) {
                    container.innerHTML = '<p style="text-align:center;">No recent events detected.</p>';
                    return;
                }

                container.innerHTML = data.events.map(event => {
                    const [lon, lat] = event.coordinates;
                    const localFormattedTime = formatToNativeTime(event.time);

                    const marker = L.marker([lat, lon]).addTo(map)
                        .bindPopup(`<b>${event.place}</b><br>Magnitude ${event.magnitude}<br><small>${localFormattedTime}</small>`);
                    markers.push(marker);

                    let severityClass = 'low';
                    if (event.magnitude >= 4.0 && event.magnitude < 5.5) severityClass = 'med';
                    if (event.magnitude >= 5.5) severityClass = 'high';

                    if (event.magnitude >= 4.0 && !notifiedEvents.has(event.id)) {
                        notifiedEvents.add(event.id);
                        if (Notification.permission === "granted") {
                            new Notification(`🚨 High Severity Earthquake: M${event.magnitude}`, {
                                body: `${event.place}\n${localFormattedTime}`,
                            });
                            playAlertSound();
                        }
                    }

                    return `
                        <div class="card ${severityClass}">
                            <div class="mag">Magnitude ${event.magnitude}</div>
                            <div class="location">${event.place}</div>
                            <div class="time">🕒 ${localFormattedTime}</div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<p style="color:#e74c3c; text-align:center;">Error connecting to FastAPI backend server.</p>';
            }
        }

        fetchAlerts();
        setInterval(fetchAlerts, 15000);
    </script>

    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
