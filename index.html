<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Early Warning App</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .card { background: #1e293b; width: 100%; max-width: 480px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        .header { margin-bottom: 16px; }
        .header h1 { font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .status { font-size: 0.85rem; color: #4ade80; margin-top: 4px; }
        #map { height: 260px; width: 100%; border-radius: 12px; margin-bottom: 16px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.2s ease; margin-bottom: 10px; }
        .btn-green { background: #22c55e; color: white; }
        .btn-green:hover { background: #16a34a; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-blue:hover { background: #2563eb; }
        #error-msg { color: #f87171; font-size: 0.85rem; margin-top: 8px; display: none; }
        .alerts-list { text-align: left; margin-top: 16px; max-height: 200px; overflow-y: auto; background: #0f172a; border-radius: 8px; padding: 10px; }
        .alert-item { font-size: 0.8rem; padding: 8px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .alert-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>🚨 Early Warning App</h1>
        <div class="status">● Live Telemetry Connected</div>
    </div>

    <div id="map"></div>

    <button class="btn btn-green" onclick="requestNotificationPermission()">🔔 Enable Emergency Popups</button>
    <button class="btn btn-blue" onclick="fetchTelemetry()">🔄 Refresh Live Telemetry</button>

    <div id="error-msg">Error connecting to FastAPI backend server.</div>

    <div class="alerts-list" id="alerts-container">
        <div class="alert-item">Fetching latest seismic telemetry...</div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize Leaflet Map
    const map = L.map('map').setView([20.0, 0.0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markersGroup = L.layerGroup().addTo(map);

    function requestNotificationPermission() {
        if ('Notification' in window) {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    alert('Emergency alerts enabled!');
                } else {
                    alert('Notification permission denied.');
                }
            });
        } else {
            alert('Browser does not support notifications.');
        }
    }

    async function fetchTelemetry() {
        const errorMsg = document.getElementById('error-msg');
        const container = document.getElementById('alerts-container');
        errorMsg.style.display = 'none';

        try {
            const response = await fetch('/api/telemetry');
            if (!response.ok) throw new Error('Network response failed');
            
            const data = await response.json();
            markersGroup.clearLayers();
            container.innerHTML = '';

            if (!data.alerts || data.alerts.length === 0) {
                container.innerHTML = '<div class="alert-item">No recent seismic events recorded.</div>';
                return;
            }

            data.alerts.forEach(alert => {
                // Convert raw epoch time to local date and time string
                const alertDate = new Date(alert.time);
                const localTime = alertDate.toLocaleTimeString(undefined, { 
                    hour: '2-digit', 
                    minute: '2-digit'
                });
                const localDate = alertDate.toLocaleDateString(undefined, {
                    month: 'short',
                    day: 'numeric'
                });

                const marker = L.circleMarker([alert.latitude, alert.longitude], {
                    radius: Math.max(alert.magnitude * 2.5, 4),
                    color: alert.magnitude >= 4.0 ? '#ef4444' : '#f59e0b',
                    fillColor: alert.magnitude >= 4.0 ? '#ef4444' : '#f59e0b',
                    fillOpacity: 0.6
                });

                // Display local date and time in map popups
                marker.bindPopup(`<b>${alert.place}</b><br>Magnitude: ${alert.magnitude}<br>Date: ${localDate}<br>Time: ${localTime}`);
                markersGroup.addLayer(marker);

                // Display local date and time aligned on the right in the list
                const item = document.createElement('div');
                item.className = 'alert-item';
                item.innerHTML = `
                    <span><strong>M ${alert.magnitude}</strong> - ${alert.place}</span>
                    <span style="font-size:0.75rem; color:#94a3b8; white-space:nowrap; margin-left:8px;">${localDate}, ${localTime}</span>
                `;
                container.appendChild(item);
            });

        } catch (err) {
            console.error(err);
            errorMsg.style.display = 'block';
        }
    }

    // Register Service Worker for PWA capabilities
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => {
                console.log('Service Worker registration failed: ', err);
            });
        });
    }

    // Initial load
    fetchTelemetry();
</script>

</body>
</html>
